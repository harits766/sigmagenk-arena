[build]
  publish = "."
  functions = "netlify/functions"
  # Skip the deploy (and its credits) when only README/docs changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!README.md' ':!docs'"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
